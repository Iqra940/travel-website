<section class="section">
    <h2>Flight Information</h2>
    <p>Plan your next journey using our sample flight form.</p>

    <form>
        <p><label>Departure City</label></p>
        <input type="text" placeholder="e.g. Karachi" required>

        <input type="text" placeholder="e.g. Istanbul" required>

        <p><label>Departure Date</label></p>
        <input type="date" required>

        <p><label>Passengers</label></p>
        <input type="number" min="1" value="1" required>

        <p><button class="btn" type="button"
        onclick="alert('This is a sample form. Live flight booking is not available.')">
